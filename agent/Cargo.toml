[package]
name = "torq-agent"
version = "0.4.0"
edition = "2021"
description = "TorqOS agent (unprivileged, run as a person's agent account, torq-agent-<person>): the agent's service, the bridge to the person's engine; and torq-mcp, TorqOS's tools for it: reading the machine, and a change proposed, never applied"
license = "Apache-2.0"

# What the two programs share: the tools, the cleaning, the machine.
[lib]
name = "torq_agent"
path = "src/lib.rs"

# A person's agent, as a service (ADR-055 3): the bridge to their engine (Claude Code), one question at a time.
[[bin]]
name = "torq-agent-service"
path = "src/service/main.rs"

# TorqOS's tools for a coding tool (ADR-051 7): an MCP server on standard input and output, run as the agent.
[[bin]]
name = "torq-mcp"
path = "src/mcp/main.rs"

# What runs as an agent, kept to its own (ADR-057): Landlock's scopes (no abstract unix socket, no signal but its
# own) and the socket families' filter, then the program. Before the engine in the service, inside the sandbox of
# `torq agent run`.
[[bin]]
name = "torq-agent-scope"
path = "src/scope/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
# A tool program's whole process group stopped at its bounds; a record never written through a link.
rustix = { version = "1.1.6", features = ["fs", "net", "process"] }
# The words of the agent service's socket (ADR-044, ADR-051 3), shared with torqcli.
torq-wire = { path = "../wire" }
# torq-agent-scope: Landlock and seccomp through maintained crates, no unsafe code here.
landlock = "0.4.7"
seccompiler = { version = "0.5", default-features = false }

[dev-dependencies]
tempfile = "3"
